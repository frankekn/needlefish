name: Needlefish PR Review
description: >-
  Strict PR review agent. Reviews the pull request diff with an isolated model
  runner and posts a COMMENT review plus a Needlefish check-run.
inputs:
  pr_number:
    description: PR number to review (defaults to the pull_request event PR)
    required: false
  runner:
    description: "Model runner: codex, claude, or pi. OpenCode is temporarily disabled (#207)."
    required: false
    default: codex
  model:
    description: Optional model id for the selected runner
    required: false
  timeout_ms:
    description: Optional per-call timeout in milliseconds
    required: false
  codex_reasoning_effort:
    description: "Codex reasoning effort: medium, high, or xhigh"
    required: false
  runner_version:
    description: >-
      npm version of the selected runner CLI. Omit to install the latest
      release; set to pin a specific version.
    required: false
  repo_path:
    description: Path to the target repo checkout to review
    required: false
    default: ${{ github.workspace }}
  github_token:
    description: Token for gh reads and posting the review and check-run
    required: false
    default: ${{ github.token }}
  allow_untrusted_author:
    description: >-
      Set to true to review a PR whose author is not OWNER, MEMBER, or
      COLLABORATOR, or is a bot. Read the PR first.
    required: false
    default: "false"
branding:
  icon: eye
  color: blue
runs:
  using: composite
  steps:
    - name: Check PR author trust
      id: trust
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_INPUT: ${{ inputs.pr_number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
        EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        EVENT_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        EVENT_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        ALLOW_UNTRUSTED_AUTHOR: ${{ inputs.allow_untrusted_author }}
      run: |
        pr="${PR_INPUT:-$EVENT_PR}"
        if [ -z "$pr" ]; then
          echo "No PR number: pass pr_number or trigger on pull_request events." >&2
          exit 1
        fi
        if [ -n "$EVENT_HEAD" ] && [ "$pr" = "$EVENT_PR" ]; then
          head="$EVENT_HEAD"
          author_association="$EVENT_AUTHOR_ASSOCIATION"
          author_type="$EVENT_AUTHOR_TYPE"
        else
          if ! pr_meta="$(gh api "repos/$REPO/pulls/$pr" --jq '(.head.sha // ""), (.author_association // ""), (.user.type // "")')"; then
            echo "::error::could not read PR #$pr metadata" >&2
            exit 1
          fi
          pr_fields=()
          while IFS= read -r field; do pr_fields+=("$field"); done <<< "$pr_meta"
          head="${pr_fields[0]:-}"
          author_association="${pr_fields[1]:-}"
          author_type="${pr_fields[2]:-}"
          if [ -z "$head" ] || [ -z "$author_association" ]; then
            echo "::error::PR #$pr returned no head or author association" >&2
            exit 1
          fi
        fi
        trusted_author=false
        if [ "$author_type" != "Bot" ]; then
          case "$author_association" in
            OWNER|MEMBER|COLLABORATOR) trusted_author=true ;;
          esac
        fi
        if [ "$trusted_author" != true ] && [ "$ALLOW_UNTRUSTED_AUTHOR" != "true" ]; then
          reason="PR author (association ${author_association:-unknown}, type ${author_type:-unknown}) is not trusted"
          echo "$reason"
          if [ -n "$head" ]; then
            random="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            invocation="${random:0:8}-${random:8:4}-4${random:13:3}-8${random:17:3}-${random:20:12}"
            measurement=$(jq -cn --arg repository "$REPO" --arg pr "$pr" --arg head "$head" \
              --arg invocation "$invocation" \
              --arg run "${GITHUB_RUN_ID:-}" --arg attempt "${GITHUB_RUN_ATTEMPT:-}" --arg job "${GITHUB_JOB:-}" '
              {schemaVersion: 1, invocationId: $invocation, repository: $repository, prNumber: ($pr | tonumber), targetHeadSha: $head,
               workflow: (if ($run | test("^[1-9][0-9]{0,19}$")) and ($attempt | test("^[1-9][0-9]{0,8}$")) and ($job | test("^[A-Za-z_][A-Za-z0-9_-]{0,99}$"))
                 then {status: "recorded", runId: $run, runAttempt: ($attempt | tonumber), jobKey: $job} else {status: "unknown"} end),
               execution: {ordinal: 1, role: "unknown"}, summaryReviewId: null, inlineReviewIds: [],
               runtime: {status: "unknown"}, pipeline: {status: "unknown"}, outcome: "skipped", verdict: null, delivery: "not_applicable"}')
            if ! live_pr="$(gh api "repos/$REPO/pulls/$pr" --jq '.state, .head.sha')"; then
              echo "::error::could not revalidate PR before posting an author-skip check" >&2
              exit 1
            fi
            live_fields=()
            while IFS= read -r field; do live_fields+=("$field"); done <<< "$live_pr"
            if [ "${live_fields[0]:-}" != "open" ] || [ "${live_fields[1]:-}" != "$head" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "skip_reason=closed_or_stale_head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$head" \
              -f status="completed" \
              -f conclusion="neutral" \
              -f external_id="$(jq -cn --argjson pr "$pr" \
                --arg run "${GITHUB_RUN_ID:-}" --arg round "$(jq -r .invocationId <<<"$measurement")" \
                '{v: 2, prNumber: $pr, roundId: $round, runId: $run}')" \
              -f "output[text]=$measurement" \
              -f "output[title]=Needlefish: skipped (author not trusted)" \
              -f "output[summary]=Needlefish reviews only PRs opened by an OWNER, MEMBER, or COLLABORATOR that is not a bot. $reason. A maintainer who has read this PR can review it by running the workflow manually with allow_untrusted_author: true." >/dev/null
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.trust.outputs.skip != 'true'
      with:
        node-version: 20
    - name: Install needlefish dependencies
      if: steps.trust.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
        pnpm install --frozen-lockfile
    - name: Install model runner CLI
      if: steps.trust.outputs.skip != 'true'
      shell: bash
      env:
        NF_RUNNER: ${{ inputs.runner }}
        NF_RUNNER_VERSION: ${{ inputs.runner_version }}
      run: |
        case "$NF_RUNNER" in
          codex) pkg="@openai/codex" ;;
          claude) pkg="@anthropic-ai/claude-code" ;;
          opencode) echo "OpenCode reviews are temporarily disabled because startup configuration isolation is incomplete. Choose codex, claude, or pi; see issue #207." >&2; exit 1 ;;
          # @mariozechner/pi ships its bin as `pi-pods`, not `pi`; the successor package
          # from the same author installs a `pi` bin, which this action expects.
          pi) pkg="@earendil-works/pi-coding-agent" ;;
          *) echo "unknown runner: $NF_RUNNER" >&2; exit 1 ;;
        esac
        ver="${NF_RUNNER_VERSION:-latest}"
        npm install -g "${pkg}@${ver}"
    - name: Authenticate model runner
      if: steps.trust.outputs.skip != 'true'
      shell: bash
      env:
        NF_RUNNER: ${{ inputs.runner }}
      run: |
        # CODEX_AUTH_JSON: contents of a logged-in codex CLI's ~/.codex/auth.json
        # (subscription auth). CODEX_API_KEY: plain API key. Either works.
        if [ "$NF_RUNNER" = "codex" ] && [ -n "${CODEX_AUTH_JSON:-}" ]; then
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
        elif [ "$NF_RUNNER" = "codex" ] && [ -n "${CODEX_API_KEY:-}" ]; then
          printf '%s' "$CODEX_API_KEY" | codex login --with-api-key
        elif [ "$NF_RUNNER" = "pi" ] && [ -n "${PI_AUTH_JSON:-}" ]; then
          mkdir -p "$HOME/.pi/agent"
          printf '%s' "$PI_AUTH_JSON" > "$HOME/.pi/agent/auth.json"
          chmod 600 "$HOME/.pi/agent/auth.json"
        fi
    - name: Needlefish review
      if: steps.trust.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        CODEX_REASONING_EFFORT: ${{ inputs.codex_reasoning_effort }}
        PR_INPUT: ${{ inputs.pr_number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
        TARGET_REPO_PATH: ${{ inputs.repo_path }}
        RUNNER_INPUT: ${{ inputs.runner }}
        MODEL_INPUT: ${{ inputs.model }}
        TIMEOUT_INPUT: ${{ inputs.timeout_ms }}
        NEEDLEFISH_ALLOW_UNTRUSTED_AUTHOR: ${{ inputs.allow_untrusted_author == 'true' && '1' || '' }}
      run: |
        pr="${PR_INPUT:-$EVENT_PR}"
        if [ -z "$pr" ]; then
          echo "No PR number: pass pr_number or trigger on pull_request events." >&2
          exit 1
        fi
        args=(--github --pr "$pr" --repo "$TARGET_REPO_PATH")
        if [ -n "$RUNNER_INPUT" ]; then args+=(--runner "$RUNNER_INPUT"); fi
        if [ -z "$MODEL_INPUT" ] && [ "$RUNNER_INPUT" = "codex" ]; then MODEL_INPUT="gpt-5.6-terra"; fi
        if [ "$RUNNER_INPUT" = "codex" ] && [ -z "$CODEX_REASONING_EFFORT" ]; then
          case "$MODEL_INPUT" in
            gpt-5.6-terra) CODEX_REASONING_EFFORT="high" ;;
            gpt-5.6-sol) CODEX_REASONING_EFFORT="medium" ;;
          esac
        fi
        if [ -n "$MODEL_INPUT" ]; then args+=(--model "$MODEL_INPUT"); fi
        if [ -n "$TIMEOUT_INPUT" ]; then args+=(--timeout-ms "$TIMEOUT_INPUT"); fi
        pnpm review "${args[@]}"
