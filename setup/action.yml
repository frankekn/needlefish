name: Setup Needlefish model runner CLI
description: Install an official Needlefish hosted runner pin without configuring authentication
inputs:
  runner:
    description: "Managed runner: codex, claude, opencode, or pi"
    required: false
    default: codex
  version:
    description: Optional npm version or dist-tag; defaults to the official hosted pin
    required: false
outputs:
  runner:
    description: Installed runner name
    value: ${{ steps.install.outputs.runner }}
  version:
    description: Installed runner version
    value: ${{ steps.install.outputs.version }}
  binary_path:
    description: Absolute path to the installed runner executable
    value: ${{ steps.install.outputs.binary_path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
    - name: Install model runner CLI
      id: install
      shell: bash
      env:
        NF_RUNNER: ${{ inputs.runner }}
        NF_RUNNER_VERSION: ${{ inputs.version }}
      run: node "$GITHUB_ACTION_PATH/../scripts/setup-runner.mjs" "$NF_RUNNER" "$NF_RUNNER_VERSION"
