name: hosted-action-canary

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review with the checked-out action ref
        required: true
      action_ref:
        description: Full reviewed Needlefish commit SHA to execute
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: hosted-action-canary-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Validate canary ref
        env:
          ACTION_REF: ${{ github.event.inputs.action_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$ACTION_REF" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "action_ref must be a full commit SHA" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi
          status=$(gh api "repos/$REPO/compare/$ACTION_REF...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "action_ref must be published on main" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.action_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          fetch-depth: 0
          path: canary-target
          persist-credentials: false
      - uses: ./
        with:
          pr_number: ${{ github.event.inputs.pr_number }}
          repo_path: ${{ github.workspace }}/canary-target
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
