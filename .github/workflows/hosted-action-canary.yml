name: hosted-action-canary

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open docs-only canary PR number; no model credential is supplied
        required: true
      action_ref:
        description: Full reviewed Needlefish commit SHA to execute
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: hosted-action-canary-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Validate canary ref
        id: validate
        env:
          ACTION_REF: ${{ github.event.inputs.action_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$ACTION_REF" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "action_ref must be a full commit SHA" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi
          status=$(gh api "repos/$REPO/compare/$ACTION_REF...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "action_ref must be published on main" >&2
            exit 1
          fi
          read -r pr_head pr_base < <(
            gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha, .base.sha] | @tsv'
          )
          if [[ ! "$pr_head" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$pr_base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR head and base must resolve to full commit SHAs" >&2
            exit 1
          fi
          mapfile -t changed_files < <(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename'
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "canary PR must change README.md or README.zh-TW.md" >&2
            exit 1
          fi
          for file in "${changed_files[@]}"; do
            if [ "$file" != "README.md" ] && [ "$file" != "README.zh-TW.md" ]; then
              echo "canary PR must be README-only; found $file" >&2
              exit 1
            fi
          done
          echo "pr_head=$pr_head" >> "$GITHUB_OUTPUT"
          echo "pr_base=$pr_base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.action_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate.outputs.pr_head }}
          fetch-depth: 0
          path: canary-target
          persist-credentials: false
      - uses: ./
        with:
          pr_number: ${{ github.event.inputs.pr_number }}
          repo_path: ${{ github.workspace }}/canary-target
        env:
          PR_BASE_SHA: ${{ steps.validate.outputs.pr_base }}
          PR_HEAD_SHA: ${{ steps.validate.outputs.pr_head }}
