# The self-managed release is baked into the runner AMI (frankekn/gha-platform images/versions.json);
# this workflow only verifies what the x64-review pool ships. Source pushes never replace it.
name: needlefish-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: needlefish-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: x64-review
    steps:
      - name: Verify self-managed installation
        run: |
          set -euo pipefail
          root="$HOME/.local/share/needlefish-self"
          release="$(readlink -e "$root/current")"
          case "$release" in
            "$root/releases/"*) ;;
            *) echo "No valid self-managed installation under $root/releases" >&2; exit 1 ;;
          esac
          if ! node - "$release/release.json" "$release" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const [metadataPath, release] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const sha256 = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          if (metadata.self_version !== path.basename(release) ||
              !/^[0-9a-f]{40}$/.test(metadata.base_sha) ||
              !/^[0-9a-f]{64}$/.test(metadata.patch_sha256) ||
              metadata.patch_sha256 !== sha256(path.join(release, "self-managed.patch")) ||
              metadata.dependency_lock_sha256 !== sha256(path.join(release, "pnpm-lock.yaml"))) {
            process.exit(1);
          }
          NODE
          then
            echo "Invalid self-managed release metadata or digest: $release" >&2; exit 1
          fi
          "$release/bin/needlefish" --version
          echo "Verified installed release: $(basename "$release")"
