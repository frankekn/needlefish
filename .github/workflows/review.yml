# Self-managed workflow: installed binary only; no upstream deployment.
name: needlefish-review
# Carries the PR number so reconciliation can find every run for one PR
# (a workflow_dispatch run reports the default branch's SHA, not the PR head).
# The active-run guard is only effective when the caller's run-name carries " PR #<n>".
run-name: "needlefish-review PR #${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (manual trigger; bypasses pull_request webhook)
        required: true
      runner:
        description: "Model runner override (codex, claude, opencode, grok, pi, acp). Leave empty: the runner host's self-managed bundle decides the lane."
        required: false
      model:
        description: Optional model id for the selected runner
        required: false
      timeout_ms:
        description: Optional per-call timeout in milliseconds
        required: false
      idle_timeout_ms:
        description: Optional opencode inactivity timeout in milliseconds
        required: false
      codex_reasoning_effort:
        description: "Codex reasoning effort: medium, high, or xhigh"
        required: false
      codex_proxy_base_url:
        description: Optional CLIProxyAPI base URL for Codex
        required: false
      codex_proxy_required:
        description: Prohibit Codex OAuth fallback
        type: boolean
        required: false
        default: false
      runs_on:
        description: Runner label for the review job
        required: false
        default: self-hosted
  workflow_call:
    inputs:
      pr_number:
        description: PR number (optional; defaults to the event PR)
        type: string
        required: false
      runner:
        description: "Model runner override (codex, claude, opencode, grok, pi, acp). Leave empty: the runner host's self-managed bundle decides the lane."
        type: string
        required: false
      model:
        description: Optional model id for the selected runner
        type: string
        required: false
      timeout_ms:
        description: Optional per-call timeout in milliseconds
        type: string
        required: false
      idle_timeout_ms:
        description: Optional opencode inactivity timeout in milliseconds
        type: string
        required: false
      codex_reasoning_effort:
        description: "Codex reasoning effort: medium, high, or xhigh"
        type: string
        required: false
      codex_proxy_base_url:
        description: Optional CLIProxyAPI base URL for Codex
        type: string
        required: false
      codex_proxy_required:
        description: Prohibit Codex OAuth fallback
        type: boolean
        required: false
        default: false
      runs_on:
        description: Runner label for the review job
        type: string
        required: false
    secrets:
      codex_proxy_api_key:
        description: CLIProxyAPI credential for Codex
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

concurrency:
  group: needlefish-${{ github.repository }}-${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ${{ inputs.runs_on || github.event.inputs.runs_on || 'self-hosted' }}
    # Hard ceiling above the 60-minute process watchdog below, so a wedged review
    # cannot hold a self-hosted runner slot indefinitely.
    timeout-minutes: 75
    if: inputs.pr_number != '' || github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Resolve PR refs
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [ -n "$EVENT_HEAD" ]; then
            head="$EVENT_HEAD"
            base="$EVENT_BASE"
            head_repo="$EVENT_HEAD_REPO"
            state="OPEN"
            if [ "$EVENT_ACTION" = "closed" ]; then state="CLOSED"; fi
          else
            mapfile -t pr_fields < <(gh pr view "$PR_NUM" -R "$REPO" --json baseRefOid,headRefOid,headRepository,state -q '.headRefOid, .baseRefOid, (.headRepository.nameWithOwner // ""), .state')
            head="${pr_fields[0]}"
            base="${pr_fields[1]}"
            head_repo="${pr_fields[2]}"
            state="${pr_fields[3]}"
          fi

          skip=false
          skip_reason=""
          if [ -z "$head" ] || [ -z "$base" ] || [ -z "$state" ]; then
            skip=true
            skip_reason="PR metadata unavailable"
          elif [ "$state" != "OPEN" ]; then
            skip=true
            skip_reason="PR state is $state"
          elif [ "$head_repo" != "$REPO" ]; then
            skip=true
            skip_reason="PR head repository $head_repo differs from $REPO"
          fi

          {
            echo "head=$head"
            echo "base=$base"
            echo "head_repo=$head_repo"
            echo "skip=$skip"
            echo "skip_reason=$skip_reason"
          } >> "$GITHUB_OUTPUT"

      - name: Report skipped PR
        if: steps.refs.outputs.skip == 'true'
        run: echo "${{ steps.refs.outputs.skip_reason }}"

      - name: Configure Needlefish temp storage
        if: steps.refs.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          temp_root="$RUNNER_TEMP/needlefish"
          mkdir -p "$temp_root"

          report_capacity_failure() {
            echo "Needlefish temp preflight failed: $1" >&2
            df -hT -- "$temp_root" >&2 || true
            df -i -- "$temp_root" >&2 || true
            exit 1
          }

          space_df="$(df -Pk -- "$temp_root")" || report_capacity_failure "cannot inspect capacity"
          available_kib="$(awk 'NR == 2 { print $4 }' <<< "$space_df")"
          if [[ ! "$available_kib" =~ ^[0-9]+$ ]]; then
            report_capacity_failure "invalid capacity data"
          fi
          if (( available_kib < 2097152 )); then
            report_capacity_failure "less than 2 GiB available"
          fi

          inode_df="$(df -Pi -- "$temp_root")" || report_capacity_failure "cannot inspect inodes"
          read -r inode_total inode_free <<< "$(awk 'NR == 2 { print $2, $4 }' <<< "$inode_df")"
          if [[ ! "$inode_total" =~ ^[0-9]+$ || ! "$inode_free" =~ ^[0-9]+$ ]]; then
            report_capacity_failure "invalid inode data"
          fi
          if (( inode_total == 0 )); then
            report_capacity_failure "invalid inode data"
          fi
          if (( inode_free * 100 < inode_total * 10 )); then
            report_capacity_failure "less than 10% inodes free"
          fi

          echo "TMPDIR=$temp_root" >> "$GITHUB_ENV"

      - name: Select self-managed Needlefish
        if: steps.refs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail

          report_release_failure() {
            title="$1"
            summary="$2"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$PR_HEAD_SHA" \
              -f status="completed" \
              -f conclusion="failure" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary"
            echo "$summary" >&2
            exit 1
          }

          # Resolve once: an install switch must not change this job's binary.
          root="$HOME/.local/share/needlefish-self"
          release="$(node -e 'process.stdout.write(require("node:fs").realpathSync(process.argv[1]))' "$root/current")" || {
            report_release_failure "Needlefish self install missing" "Install the self-managed Needlefish bundle on this runner before retrying."
          }
          case "$release" in
            "$root/releases/"*) ;;
            *) report_release_failure "Invalid Needlefish self install" "The self-managed current link must select a release under $root/releases." ;;
          esac
          metadata="$release/release.json"
          binary="$release/bin/needlefish"
          if ! node - "$metadata" "$release" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const [metadataPath, release] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const sha256 = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          if (metadata.self_version !== path.basename(release) ||
              !/^[0-9a-f]{40}$/.test(metadata.base_sha) ||
              !/^[0-9a-f]{64}$/.test(metadata.patch_sha256) ||
              metadata.patch_sha256 !== sha256(path.join(release, "self-managed.patch")) ||
              metadata.dependency_lock_sha256 !== sha256(path.join(release, "pnpm-lock.yaml"))) {
            process.exit(1);
          }
          NODE
          then
            report_release_failure "Invalid Needlefish self install metadata" "Self-managed release metadata or patch/lockfile digest does not match $release."
          fi
          if [ ! -x "$binary" ] || ! "$binary" --version; then
            report_release_failure "Needlefish self install is not runnable" "The installed executable is unavailable at $binary."
          fi

          printf 'NEEDLEFISH_BIN=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Checkout review target (PR head)
        if: steps.refs.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.refs.outputs.head }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Needlefish review
        if: steps.refs.outputs.skip != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ steps.refs.outputs.base }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.head }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          # Empty by default: lane selection belongs to the runner host's self-managed
          # bundle (its loader pins runner, model, and effort). A non-empty override
          # is for manual dispatches and evals only.
          NEEDLEFISH_RUNNER_INPUT: ${{ inputs.runner || github.event.inputs.runner }}
          NEEDLEFISH_MODEL_INPUT: ${{ inputs.model || github.event.inputs.model }}
          NEEDLEFISH_TIMEOUT_MS_INPUT: ${{ inputs.timeout_ms || github.event.inputs.timeout_ms }}
          OPENCODE_IDLE_TIMEOUT_MS_INPUT: ${{ inputs.idle_timeout_ms || github.event.inputs.idle_timeout_ms }}
          # *_INPUT: an empty caller input must not overwrite an effort the runner
          # host pins in its service environment or bundle loader.
          CODEX_REASONING_EFFORT_INPUT: ${{ inputs.codex_reasoning_effort || github.event.inputs.codex_reasoning_effort }}
          # The base URL is not secret; a repo variable lets pull_request events
          # (which carry no workflow inputs) use the same proxy route that a
          # dispatch with codex_proxy_base_url uses. Inputs win when supplied.
          CODEX_PROXY_BASE_URL_INPUT: ${{ inputs.codex_proxy_base_url || vars.CODEX_PROXY_BASE_URL }}
          CODEX_PROXY_API_KEY_INPUT: ${{ secrets.codex_proxy_api_key }}
          NEEDLEFISH_CODEX_PROXY_REQUIRED_INPUT: ${{ inputs.codex_proxy_required && '1' || '' }}
          # ubuntu-needlefish routes pi through the local CLIProxyAPI (ccp);
          # credentials live in the proxy, provider registered in ~/.pi/agent/models.json.
          PI_PROVIDER: cliproxy
          PI_AUTH_MODE: proxy
          # npm-global bin is not on the runner service PATH.
          PI_BIN: /home/termtek/.npm-global/bin/pi
          NEEDLEFISH_RECHECK_INPUT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          if [ -z "${NEEDLEFISH_BIN:-}" ] || [ ! -x "$NEEDLEFISH_BIN" ]; then
            echo "Selected self-managed Needlefish is unavailable. Reinstall the local bundle on this runner." >&2
            exit 1
          fi
          if [[ ! "$PR_NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR number must be a positive integer, received '$PR_NUM'." >&2
            exit 1
          fi
          if [ -n "${CODEX_REASONING_EFFORT_INPUT:-}" ]; then export CODEX_REASONING_EFFORT="$CODEX_REASONING_EFFORT_INPUT"; fi
          # Preserve caller policy even when the host selects the runner; an
          # empty input must not clear a stricter host policy.
          if [ -n "$NEEDLEFISH_CODEX_PROXY_REQUIRED_INPUT" ]; then export NEEDLEFISH_CODEX_PROXY_REQUIRED="$NEEDLEFISH_CODEX_PROXY_REQUIRED_INPUT"; fi
          # No caller pair: keep host defaults. Either caller value: replace BOTH
          # (including an empty counterpart), never mix a caller URL with a host
          # key. The resolved runner validates the pair; non-Codex ignores it.
          if [ -n "$CODEX_PROXY_BASE_URL_INPUT" ] || [ -n "$CODEX_PROXY_API_KEY_INPUT" ]; then
            export CODEX_PROXY_BASE_URL="$CODEX_PROXY_BASE_URL_INPUT"
            export CODEX_PROXY_API_KEY="$CODEX_PROXY_API_KEY_INPUT"
            if [ "$NEEDLEFISH_RUNNER_INPUT" = "codex" ]; then
              if [ -z "$CODEX_PROXY_BASE_URL_INPUT" ] || [ -z "$CODEX_PROXY_API_KEY_INPUT" ]; then
                echo "Codex proxy base URL and API key must be supplied together. Review has not started; complete the proxy settings and retry." >&2
                exit 1
              fi
            fi
          fi
          if [ "$NEEDLEFISH_RUNNER_INPUT" = "codex" ]; then
            if [ -z "${CODEX_BIN:-}" ] && [ -x "$HOME/.local/bin/codex" ]; then
              export CODEX_BIN="$HOME/.local/bin/codex"
            fi
            codex_bin="${CODEX_BIN:-codex}"
            codex_version=$("$codex_bin" --version) || {
              echo "Unable to run the selected Codex CLI." >&2
              exit 1
            }
            if [ "$codex_version" != "codex-cli 0.153.4" ]; then
              echo "Selected Codex CLI must be codex-cli 0.153.4; found '$codex_version'." >&2
              exit 1
            fi
            export CODEX_BIN="$codex_bin"
          fi
          args=(--github --pr "$PR_NUM")
          if [ -z "$NEEDLEFISH_MODEL_INPUT" ]; then
            case "$NEEDLEFISH_RUNNER_INPUT" in
              codex) NEEDLEFISH_MODEL_INPUT="gpt-5.6-terra" ;;
              pi) NEEDLEFISH_MODEL_INPUT="gpt-5.6-terra" ;;
              grok) NEEDLEFISH_MODEL_INPUT="grok-4.5" ;;
            esac
          fi
          if [ -z "$CODEX_REASONING_EFFORT" ]; then
            case "$NEEDLEFISH_MODEL_INPUT" in
              gpt-5.6-sol) export CODEX_REASONING_EFFORT="medium" ;;
              gpt-5.6-terra) export CODEX_REASONING_EFFORT="high" ;;
            esac
          fi
          if [ -z "$NEEDLEFISH_TIMEOUT_MS_INPUT" ] && [ "$NEEDLEFISH_MODEL_INPUT" = "gpt-5.6-terra" ] && [ "$CODEX_REASONING_EFFORT" = "xhigh" ]; then
            NEEDLEFISH_TIMEOUT_MS_INPUT="1200000"
          fi
          if [ "$NEEDLEFISH_RUNNER_INPUT" = "codex" ] && [ "$NEEDLEFISH_MODEL_INPUT" = "gpt-5.6-terra" ] && [ "$CODEX_REASONING_EFFORT" = "xhigh" ]; then
            export CODEX_SERVICE_TIER="fast"
          fi
          if [ -n "$NEEDLEFISH_RUNNER_INPUT" ]; then args+=(--runner "$NEEDLEFISH_RUNNER_INPUT"); fi
          if [ -n "$NEEDLEFISH_MODEL_INPUT" ]; then args+=(--model "$NEEDLEFISH_MODEL_INPUT"); fi
          if [ -n "$NEEDLEFISH_TIMEOUT_MS_INPUT" ]; then args+=(--timeout-ms "$NEEDLEFISH_TIMEOUT_MS_INPUT"); fi
          if [ -n "$OPENCODE_IDLE_TIMEOUT_MS_INPUT" ]; then export OPENCODE_IDLE_TIMEOUT_MS="$OPENCODE_IDLE_TIMEOUT_MS_INPUT"; fi
          if [ -n "$NEEDLEFISH_RECHECK_INPUT" ]; then args+=(--recheck); fi
          # Review deadline (needlefish stops starting model calls past it) and a
          # process watchdog above it. A watchdog kill leaves the in-progress
          # check without a verdict, so it is closed as a failure here rather
          # than left pending for the reconcile job to re-dispatch.
          export NEEDLEFISH_REVIEW_TIMEOUT_MS="${NEEDLEFISH_REVIEW_TIMEOUT_MS:-3300000}"
          set +e
          timeout --signal=TERM --kill-after=60s 3600s "$NEEDLEFISH_BIN" "${args[@]}"
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            check_id=$(gh api "repos/$REPO/commits/$PR_HEAD_SHA/check-runs?check_name=Needlefish&filter=latest" --jq '.check_runs[] | select(.status != "completed") | .id' | head -n 1 || true)
            if [ -n "$check_id" ]; then
              gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
                -f status=completed \
                -f conclusion=failure \
                -f 'output[title]=Needlefish: review failed' \
                -f 'output[summary]=Needlefish exceeded the process watchdog after its review deadline.' >/dev/null
            fi
          fi
          exit "$status"

  # S6 reconciliation: the latest open head of this PR must eventually carry a
  # terminal Needlefish check that is not an infra error. Crashed runs would
  # otherwise leave a head with no verdict at all. Bounded: at most two
  # infra-failed checks on a head are tolerated before the finalizer gives up
  # loudly. The cap counts ALL check-runs on the head (filter=all); a
  # usage-limited runner does not recover in minutes, and every re-dispatch
  # spends a full model call before failing again.
  reconcile:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: write
    steps:
      - name: Re-dispatch when the latest head lacks a terminal result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ -z "$PR_NUM" ]; then
            echo "no PR number in context; nothing to reconcile" >&2
            exit 0
          fi
          if [[ ! "$PR_NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR number must be a positive integer, received '$PR_NUM'"
            exit 1
          fi
          state=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq .state)
          if [ "$state" != "open" ]; then
            echo "PR #$PR_NUM is $state; nothing to reconcile"
            exit 0
          fi
          head_repo=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq .head.repo.full_name)
          if [ "$head_repo" != "$REPO" ]; then
            echo "PR #$PR_NUM comes from $head_repo; fork reviews are skipped"
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq .head.sha)
          report_retry_required() {
            summary="$1"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$head" \
              -f status="completed" \
              -f conclusion="failure" \
              -f "output[title]=Needlefish: caller retry required" \
              -f "output[summary]=$summary" >/dev/null
          }
          # filter=all: the default (latest) returns one check-run per name, and
          # every review check is named "Needlefish", so the retry cap below would
          # otherwise never see more than one failure and could never trip.
          runs_url="repos/$REPO/commits/$head/check-runs?check_name=Needlefish&per_page=100&filter=all"
          valid=$(gh api "$runs_url" --jq '[.check_runs[] | select(.conclusion == "success" or .conclusion == "neutral" or (.conclusion == "failure" and (.output.title // "") != "Needlefish: review failed"))] | length')
          if [ "$valid" -gt 0 ]; then
            echo "head $head already has a terminal Needlefish verdict; nothing to reconcile"
            exit 0
          fi
          workflow_file="${WORKFLOW_REF#"$REPO/.github/workflows/"}"
          workflow_file="${workflow_file%@*}"
          if [ -z "$workflow_file" ] || [ "$workflow_file" = "$WORKFLOW_REF" ] || [[ "$workflow_file" == */* ]]; then
            echo "::error::invalid caller workflow ref: $WORKFLOW_REF"
            exit 1
          fi
          workflow_probe=""
          if ! workflow_probe=$(gh api "repos/$REPO/actions/workflows/$workflow_file" 2>&1); then
            if [[ "$workflow_probe" == *"HTTP 404"* ]]; then
              report_retry_required "Caller workflow $workflow_file is unavailable. Add workflow_dispatch with a required pr_number input, then retry this PR review."
              exit 0
            fi
            echo "::error::review workflow probe failed: $workflow_probe"
            exit 1
          fi
          # Active runs are matched by THIS workflow file and the PR number in
          # run-name, never by head_sha or a literal workflow name: a
          # workflow_dispatch run reports the default branch's SHA, and caller
          # repos name the workflow whatever they like. This run is excluded.
          active=0
          for status in in_progress queued; do
            n=$(gh api "repos/$REPO/actions/workflows/$workflow_file/runs?status=$status&per_page=100" --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select(.display_title | test(\" PR #$PR_NUM\$\"))] | length")
            active=$((active + n))
          done
          if [ "$active" -gt 0 ]; then
            echo "a $workflow_file run for PR #$PR_NUM is still active or queued; letting it finish"
            exit 0
          fi
          infra_fails=$(gh api "$runs_url" --jq '[.check_runs[] | select(.conclusion == "failure" and (.output.title // "") == "Needlefish: review failed")] | length')
          if [ "$infra_fails" -ge 2 ]; then
            echo "::error::head $head has $infra_fails infra-failed reviews; retry cap reached, not re-dispatching"
            exit 0
          fi
          # Runs that fail before creating a check must also exhaust retries.
          completed_fails=$(gh api "repos/$REPO/actions/workflows/$workflow_file/runs?status=completed&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\") | select(.display_title | test(\" PR #$PR_NUM\$\"))] | length")
          if [ "$completed_fails" -ge 3 ]; then
            echo "::error::$workflow_file for PR #$PR_NUM has $completed_fails completed failed or cancelled runs; retry cap reached, not re-dispatching"
            exit 0
          fi
          dispatch_error=""
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          if [ -z "$default_branch" ]; then
            echo "::error::repository default branch is unavailable"
            exit 1
          fi
          if ! dispatch_error=$(gh workflow run "$workflow_file" --repo "$REPO" --ref "$default_branch" -f pr_number="$PR_NUM" 2>&1); then
            report_retry_required "Could not dispatch $workflow_file with pr_number. The caller must grant actions: write and declare workflow_dispatch.inputs.pr_number. GitHub reported: $dispatch_error"
            exit 0
          fi
          echo "reconciliation dispatched for PR #$PR_NUM head ${head:0:10} (infra failures so far: $infra_fails)"
