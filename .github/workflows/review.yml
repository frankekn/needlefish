# Self-managed workflow: installed binary only; no upstream deployment.
name: needlefish-review
# Carries the PR number so reconciliation can find every run for one PR
# (a workflow_dispatch run reports the default branch's SHA, not the PR head).
# The active-run guard is only effective when the caller's run-name carries " PR #<n>".
run-name: "needlefish-review PR #${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (manual trigger; bypasses pull_request webhook)
        required: true
      recheck:
        description: Force a full review even when this head was already reviewed
        type: boolean
        required: false
        default: false
      runner:
        description: "Model runner: codex, claude, opencode, grok, or pi"
        required: false
        default: codex
      model:
        description: Optional model id for the selected runner
        required: false
      timeout_ms:
        description: Optional per-call timeout in milliseconds
        required: false
      idle_timeout_ms:
        description: Optional opencode inactivity timeout in milliseconds
        required: false
      codex_reasoning_effort:
        description: "Codex reasoning effort: medium, high, or xhigh"
        required: false
      codex_proxy_base_url:
        description: Optional CLIProxyAPI base URL for Codex
        required: false
      codex_proxy_required:
        description: Prohibit Codex OAuth fallback
        type: boolean
        required: false
        default: false
      allow_untrusted_author:
        description: Review a PR whose author is not OWNER, MEMBER, or COLLABORATOR, or is a bot (read the PR first)
        type: boolean
        required: false
        default: false
      runs_on:
        description: Runner label for the review job (defaults to NEEDLEFISH_RUNS_ON or self-hosted)
        required: false
  workflow_call:
    inputs:
      pr_number:
        description: PR number (optional; defaults to the event PR)
        type: string
        required: false
      recheck:
        description: Force a full review even when this head was already reviewed
        type: boolean
        required: false
        default: false
      runner:
        description: "Model runner: codex, claude, opencode, grok, or pi"
        type: string
        required: false
        default: codex
      model:
        description: Optional model id for the selected runner
        type: string
        required: false
      timeout_ms:
        description: Optional per-call timeout in milliseconds
        type: string
        required: false
      idle_timeout_ms:
        description: Optional opencode inactivity timeout in milliseconds
        type: string
        required: false
      codex_reasoning_effort:
        description: "Codex reasoning effort: medium, high, or xhigh"
        type: string
        required: false
      codex_proxy_base_url:
        description: Optional CLIProxyAPI base URL for Codex
        type: string
        required: false
      codex_proxy_required:
        description: Prohibit Codex OAuth fallback
        type: boolean
        required: false
        default: false
      allow_untrusted_author:
        description: Review a PR whose author is not OWNER, MEMBER, or COLLABORATOR, or is a bot (read the PR first)
        type: boolean
        required: false
        default: false
      runs_on:
        description: Runner label for the review job
        type: string
        required: false
    secrets:
      codex_proxy_api_key:
        description: CLIProxyAPI credential for Codex
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

concurrency:
  group: needlefish-${{ github.repository }}-${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ${{ inputs.runs_on || github.event.inputs.runs_on || vars.NEEDLEFISH_RUNS_ON || 'self-hosted' }}
    if: inputs.pr_number != '' || github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      head: ${{ steps.refs.outputs.head }}
    steps:
      - name: Resolve PR refs
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          EVENT_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          ALLOW_UNTRUSTED_AUTHOR: ${{ inputs.allow_untrusted_author && '1' || '' }}
        run: |
          if [ -n "$EVENT_HEAD" ]; then
            head="$EVENT_HEAD"
            base="$EVENT_BASE"
            head_repo="$EVENT_HEAD_REPO"
            state="OPEN"
            if [ "$EVENT_ACTION" = "closed" ]; then state="CLOSED"; fi
            author_association="$EVENT_AUTHOR_ASSOCIATION"
            author_type="$EVENT_AUTHOR_TYPE"
          else
            mapfile -t pr_fields < <(gh pr view "$PR_NUM" -R "$REPO" --json baseRefOid,headRefOid,headRepository,state -q '.headRefOid, .baseRefOid, (.headRepository.nameWithOwner // ""), .state')
            head="${pr_fields[0]}"
            base="${pr_fields[1]}"
            head_repo="${pr_fields[2]}"
            state="${pr_fields[3]}"
          fi
          # Keep the resolved target available when a pre-review step fails.
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ -z "$EVENT_HEAD" ]; then
            if ! author_meta="$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '(.author_association // ""), (.user.type // "")')"; then
              echo "::error::could not read the author of PR #$PR_NUM"
              exit 1
            fi
            mapfile -t author_fields <<< "$author_meta"
            author_association="${author_fields[0]:-}"
            author_type="${author_fields[1]:-}"
            if [ -z "$author_association" ]; then
              echo "::error::PR #$PR_NUM returned no author association"
              exit 1
            fi
          fi

          trusted_author=false
          if [ "$author_type" != "Bot" ]; then
            case "$author_association" in
              OWNER|MEMBER|COLLABORATOR) trusted_author=true ;;
            esac
          fi

          skip=false
          skip_reason=""
          if [ -z "$head" ] || [ -z "$base" ] || [ -z "$state" ]; then
            skip=true
            skip_reason="PR metadata unavailable"
          elif [ "$state" != "OPEN" ]; then
            skip=true
            skip_reason="PR state is $state"
          elif [ "$head_repo" != "$REPO" ]; then
            skip=true
            skip_reason="PR head repository $head_repo differs from $REPO"
          elif [ "$trusted_author" != true ] && [ -z "$ALLOW_UNTRUSTED_AUTHOR" ]; then
            skip=true
            skip_reason="PR author (association ${author_association:-unknown}, type ${author_type:-unknown}) is not trusted"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$head" \
              -f status="completed" \
              -f conclusion="neutral" \
              -f external_id="$(jq -cn --argjson pr "$PR_NUM" \
                --arg run "$GITHUB_RUN_ID" --arg round "skip-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                '{v: 2, prNumber: $pr, roundId: $round, runId: $run}')" \
              -f "output[title]=Needlefish: skipped (author not trusted)" \
              -f "output[summary]=Needlefish runs model CLIs unrestricted on trusted runners, so it reviews only PRs opened by an OWNER, MEMBER, or COLLABORATOR that is not a bot. $skip_reason. A maintainer who has read this PR can review it by running the review workflow manually with allow_untrusted_author: true." >/dev/null
          fi

          {
            echo "base=$base"
            echo "head_repo=$head_repo"
            echo "skip=$skip"
            echo "skip_reason=$skip_reason"
          } >> "$GITHUB_OUTPUT"

      - name: Report skipped PR
        if: steps.refs.outputs.skip == 'true'
        run: echo "${{ steps.refs.outputs.skip_reason }}"

      - name: Configure Needlefish temp storage
        if: steps.refs.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          temp_root="$RUNNER_TEMP/needlefish"
          mkdir -p "$temp_root"

          report_capacity_failure() {
            echo "Needlefish temp preflight failed: $1" >&2
            df -hT -- "$temp_root" >&2 || true
            df -i -- "$temp_root" >&2 || true
            exit 1
          }

          space_df="$(df -Pk -- "$temp_root")" || report_capacity_failure "cannot inspect capacity"
          available_kib="$(awk 'NR == 2 { print $4 }' <<< "$space_df")"
          if [[ ! "$available_kib" =~ ^[0-9]+$ ]]; then
            report_capacity_failure "invalid capacity data"
          fi
          if (( available_kib < 2097152 )); then
            report_capacity_failure "less than 2 GiB available"
          fi

          inode_df="$(df -Pi -- "$temp_root")" || report_capacity_failure "cannot inspect inodes"
          read -r inode_total inode_free <<< "$(awk 'NR == 2 { print $2, $4 }' <<< "$inode_df")"
          if [[ ! "$inode_total" =~ ^[0-9]+$ || ! "$inode_free" =~ ^[0-9]+$ ]]; then
            report_capacity_failure "invalid inode data"
          fi
          if (( inode_total == 0 )); then
            report_capacity_failure "invalid inode data"
          fi
          if (( inode_free * 100 < inode_total * 10 )); then
            report_capacity_failure "less than 10% inodes free"
          fi

          echo "TMPDIR=$temp_root" >> "$GITHUB_ENV"

      - name: Select self-managed Needlefish
        if: steps.refs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail

          report_release_failure() {
            title="$1"
            summary="$2"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$PR_HEAD_SHA" \
              -f status="completed" \
              -f conclusion="failure" \
              -f external_id="$(jq -cn --argjson pr "$PR_NUM" --arg run "$GITHUB_RUN_ID" \
                --arg attempt "$GITHUB_RUN_ATTEMPT" --arg round "precheck-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                '{v: 2, prNumber: $pr, roundId: $round, runId: $run, runAttempt: $attempt}')" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary"
            echo "$summary" >&2
            exit 1
          }

          # Resolve once: an install switch must not change this job's binary.
          root="$HOME/.local/share/needlefish-self"
          release="$(node -e 'process.stdout.write(require("node:fs").realpathSync(process.argv[1]))' "$root/current")" || {
            report_release_failure "Needlefish self install missing" "Install the self-managed Needlefish bundle on this runner before retrying."
          }
          case "$release" in
            "$root/releases/"*) ;;
            *) report_release_failure "Invalid Needlefish self install" "The self-managed current link must select a release under $root/releases." ;;
          esac
          metadata="$release/release.json"
          binary="$release/bin/needlefish"
          if ! node - "$metadata" "$release" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const [metadataPath, release] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const sha256 = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          if (metadata.self_version !== path.basename(release) ||
              !/^[0-9a-f]{40}$/.test(metadata.base_sha) ||
              !/^[0-9a-f]{64}$/.test(metadata.patch_sha256) ||
              metadata.patch_sha256 !== sha256(path.join(release, "self-managed.patch")) ||
              metadata.dependency_lock_sha256 !== sha256(path.join(release, "pnpm-lock.yaml"))) {
            process.exit(1);
          }
          NODE
          then
            report_release_failure "Invalid Needlefish self install metadata" "Self-managed release metadata or patch/lockfile digest does not match $release."
          fi
          if [ ! -x "$binary" ] || ! "$binary" --version; then
            report_release_failure "Needlefish self install is not runnable" "The installed executable is unavailable at $binary."
          fi

          printf 'NEEDLEFISH_BIN=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Checkout review target (PR head)
        if: steps.refs.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.refs.outputs.head }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Needlefish review
        if: steps.refs.outputs.skip != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ steps.refs.outputs.base }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.head }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          NEEDLEFISH_RUNNER_INPUT: ${{ inputs.runner || github.event.inputs.runner || 'codex' }}
          # Self-hosted default lane comes from repo variables; qualified by eval/results/2026-09-20-codex-cpa-*-x1.json (#172):
          # deepseek-v4.1-flash via CLIProxyAPI recall 87% / FP 4% / noise 0.016, mean 51 s. Hosted runs still pass explicit inputs.
          NEEDLEFISH_MODEL_INPUT: ${{ inputs.model || github.event.inputs.model || vars.NEEDLEFISH_MODEL }}
          # Operator-selected fallback behind the same proxy; primary model stays configurable.
          NEEDLEFISH_MODEL_FALLBACKS: gpt-6.1-sol
          NEEDLEFISH_TIMEOUT_MS_INPUT: ${{ inputs.timeout_ms || github.event.inputs.timeout_ms }}
          OPENCODE_IDLE_TIMEOUT_MS_INPUT: ${{ inputs.idle_timeout_ms || github.event.inputs.idle_timeout_ms }}
          CODEX_REASONING_EFFORT: ${{ inputs.codex_reasoning_effort || github.event.inputs.codex_reasoning_effort || vars.NEEDLEFISH_CODEX_REASONING_EFFORT }}
          # The base URL is not secret; a repo variable lets pull_request events
          # (which carry no workflow inputs) use the same proxy route that a
          # dispatch with codex_proxy_base_url uses. Inputs win when supplied.
          CODEX_PROXY_BASE_URL_INPUT: ${{ inputs.codex_proxy_base_url || vars.CODEX_PROXY_BASE_URL }}
          CODEX_PROXY_API_KEY_INPUT: ${{ (inputs.codex_proxy_base_url || vars.CODEX_PROXY_BASE_URL) && secrets.codex_proxy_api_key || '' }}
          NEEDLEFISH_CODEX_PROXY_REQUIRED_INPUT: ${{ inputs.codex_proxy_required && '1' || '' }}
          # ubuntu-needlefish routes pi through the local CLIProxyAPI (ccp);
          # credentials live in the proxy, provider registered in ~/.pi/agent/models.json.
          PI_PROVIDER: cliproxy
          PI_AUTH_MODE: proxy
          # npm-global bin is not on the runner service PATH.
          PI_BIN: /home/termtek/.npm-global/bin/pi
          NEEDLEFISH_CHECK_APP_ID: ""
          NEEDLEFISH_RECHECK_INPUT: ${{ inputs.recheck && '1' || '' }}
          NEEDLEFISH_ALLOW_UNTRUSTED_AUTHOR: ${{ inputs.allow_untrusted_author && '1' || '' }}
        run: |
          if [ -z "${NEEDLEFISH_BIN:-}" ] || [ ! -x "$NEEDLEFISH_BIN" ]; then
            echo "Selected self-managed Needlefish is unavailable. Reinstall the local bundle on this runner." >&2
            exit 1
          fi
          if [[ ! "$PR_NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR number must be a positive integer, received '$PR_NUM'." >&2
            exit 1
          fi
          if [ "$NEEDLEFISH_RUNNER_INPUT" = "codex" ]; then
            # Same rule as runnerCommand: trim, and a blank value means unset.
            codex_bin=$(node -e 'process.stdout.write((process.env.CODEX_BIN || "").trim())')
            if [ -z "$codex_bin" ] && [ -x "$HOME/.local/bin/codex" ]; then
              codex_bin="$HOME/.local/bin/codex"
            fi
            [ -n "$codex_bin" ] || codex_bin=codex
            codex_version=$("$codex_bin" --version) || {
              echo "Unable to run the selected Codex CLI." >&2
              exit 1
            }
            # Self-hosted operators track Codex latest; log the selected release for diagnosis.
            echo "Selected Codex CLI: $codex_version"
            export CODEX_BIN="$codex_bin"
            if [ -n "$CODEX_PROXY_BASE_URL_INPUT" ] || [ -n "$CODEX_PROXY_API_KEY_INPUT" ]; then
              if [ -z "$CODEX_PROXY_BASE_URL_INPUT" ] || [ -z "$CODEX_PROXY_API_KEY_INPUT" ]; then
                echo "Codex proxy base URL and API key must be supplied together." >&2
                exit 1
              fi
              export CODEX_PROXY_BASE_URL="$CODEX_PROXY_BASE_URL_INPUT"
              export CODEX_PROXY_API_KEY="$CODEX_PROXY_API_KEY_INPUT"
            fi
            if [ -n "$NEEDLEFISH_CODEX_PROXY_REQUIRED_INPUT" ]; then export NEEDLEFISH_CODEX_PROXY_REQUIRED="$NEEDLEFISH_CODEX_PROXY_REQUIRED_INPUT"; fi
          fi
          args=(--github --pr "$PR_NUM")
          if [ -z "$NEEDLEFISH_MODEL_INPUT" ]; then
            case "$NEEDLEFISH_RUNNER_INPUT" in
              codex) NEEDLEFISH_MODEL_INPUT="gpt-5.6-terra" ;;
              pi) NEEDLEFISH_MODEL_INPUT="gpt-5.6-terra" ;;
              grok) NEEDLEFISH_MODEL_INPUT="grok-4.5" ;;
            esac
          fi
          if [ -z "$CODEX_REASONING_EFFORT" ]; then
            case "$NEEDLEFISH_MODEL_INPUT" in
              gpt-5.6-sol) export CODEX_REASONING_EFFORT="medium" ;;
              gpt-5.6-terra) export CODEX_REASONING_EFFORT="xhigh" ;;
              deepseek-v4.1-flash|glm-5.3-flash|devin/swe-2) export CODEX_REASONING_EFFORT="high" ;;
            esac
          fi
          if [ "$NEEDLEFISH_RUNNER_INPUT" = "codex" ] && [ "$NEEDLEFISH_MODEL_INPUT" = "gpt-5.6-terra" ] && [ "$CODEX_REASONING_EFFORT" = "xhigh" ]; then
            export CODEX_SERVICE_TIER="fast"
          fi
          if [ -n "$NEEDLEFISH_RUNNER_INPUT" ]; then args+=(--runner "$NEEDLEFISH_RUNNER_INPUT"); fi
          if [ -n "$NEEDLEFISH_MODEL_INPUT" ]; then args+=(--model "$NEEDLEFISH_MODEL_INPUT"); fi
          if [ -n "$NEEDLEFISH_TIMEOUT_MS_INPUT" ]; then args+=(--timeout-ms "$NEEDLEFISH_TIMEOUT_MS_INPUT"); fi
          if [ -n "$OPENCODE_IDLE_TIMEOUT_MS_INPUT" ]; then export OPENCODE_IDLE_TIMEOUT_MS="$OPENCODE_IDLE_TIMEOUT_MS_INPUT"; fi
          if [ -n "$NEEDLEFISH_RECHECK_INPUT" ]; then args+=(--recheck); fi
          # The operator-selected fallback uses the same proxy; completed verdicts never switch models.
          chain=()
          if [ "$NEEDLEFISH_RUNNER_INPUT" = "codex" ] && [ -n "$CODEX_PROXY_BASE_URL_INPUT" ] && [ -n "$NEEDLEFISH_MODEL_INPUT" ]; then
            IFS=',' read -r -a chain <<< "${NEEDLEFISH_MODEL_FALLBACKS:-}"
          fi
          out=""; err_out=""
          base_args=("${args[@]}")
          run_review() {
            local model="$1"; local rc
            args=("${base_args[@]}")
            if [ -n "$model" ]; then
              export CODEX_REASONING_EFFORT="medium"
              unset CODEX_SERVICE_TIER
              for i in "${!args[@]}"; do if [ "${args[$i]}" = "--model" ]; then args[$((i+1))]="$model"; fi; done
            fi
            export NEEDLEFISH_PREVIOUS_CHECK_ID
            NEEDLEFISH_PREVIOUS_CHECK_ID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?check_name=Needlefish&per_page=100" --jq '[.check_runs[].id] | max // 0') || NEEDLEFISH_PREVIOUS_CHECK_ID=""
            local err_file
            err_file=$(mktemp)
            set +e
            out=$("$NEEDLEFISH_BIN" "${args[@]}" 2>"$err_file"); rc=$?
            set -e
            err_out=$(cat "$err_file"); rm -f "$err_file"
            printf '%s\n' "$out"
            [ -n "$err_out" ] && printf '%s\n' "$err_out" >&2
            return $rc
          }
          # shortcut: legacy releases misclassify upstream faults; remove this check fallback after reliable outcomes ship.
          # A check must be newer than the invocation snapshot; missing evidence preserves the failure.
          runner_check_failed() {
            local checks_json
            checks_json=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?check_name=Needlefish&per_page=100") || return 1
            node -e '
              let input = "";
              process.stdin.on("data", chunk => { input += chunk; });
              process.stdin.on("end", () => {
                try {
                  const checks = JSON.parse(input).check_runs;
                  const previous = process.env.NEEDLEFISH_PREVIOUS_CHECK_ID ?? "";
                  if (!/^[0-9]+$/.test(previous)) process.exit(1);
                  const appIdInput = process.env.NEEDLEFISH_CHECK_APP_ID || "";
                  const appId = appIdInput ? Number(appIdInput) : null;
                  if (appIdInput && (!/^[1-9][0-9]*$/.test(appIdInput) || !Number.isSafeInteger(appId))) process.exit(1);
                  const currentRun = externalId => {
                    if (externalId === process.env.GITHUB_RUN_ID) return true;
                    try {
                      const round = JSON.parse(externalId);
                      return round?.v === 2 && round.runId === process.env.GITHUB_RUN_ID && round.prNumber === Number(process.env.PR_NUM);
                    } catch { return false; }
                  };
                  const check = checks.filter(c =>
                    c.id > Number(previous) &&
                    c.name === "Needlefish" &&
                    currentRun(c.external_id) &&
                    (appId === null ? c.app?.slug === "github-actions" : c.app?.id === appId)
                  ).sort((a, b) => b.id - a.id)[0];
                  const prefix = "Review errored and did NOT pass this PR.\n\n```\n";
                  const error = check?.output?.summary?.startsWith(prefix) ? check.output.summary.slice(prefix.length).split("\n")[0] : "";
                  const failed = check?.status === "completed" && check.conclusion === "failure" && check.output.title === "Needlefish: review failed";
                  const runnerExit = /^(?:codex|claude|opencode|grok|pi|acp|openai) runner exited [1-9][0-9]*;/.test(error);
                  const timeout = /^spawn .+ E(?:IDLE)?TIMEDOUT(?:[.;]|$)/.test(error);
                  const outputFailure = error.startsWith("no JSON object found in codex output") && /likely cause: (empty output|truncated output|html error page)(?:[;.]|$)/.test(error);
                  process.exit(failed && (runnerExit || timeout || outputFailure) ? 0 : 1);
                } catch { process.exit(1); }
              });
            ' <<<"$checks_json"
          }
          if run_review ""; then exit 0; else rc=$?; fi
          for next in "${chain[@]}"; do
            [ -n "$next" ] || continue
            # Prefer the controlled terminal outcome. Legacy runner faults require this run own check.
            outcome_line="$(grep -a '^needlefish-outcome ' <<<"$out" | tail -n 1 || true)"
            if ! node -e 'let s="";process.stdin.on("data",(d)=>{s+=d});process.stdin.on("end",()=>{let o;try{o=JSON.parse(s)}catch{process.exit(1)}process.exit(o&&o.outcome==="failure"&&o.operational===true?0:1)});' <<<"${outcome_line#needlefish-outcome }"; then
              if ! runner_check_failed; then
                echo "needlefish: no verified operational runner failure; not switching provider" >&2; exit $rc
              fi
            fi
            echo "::warning title=Needlefish provider fallback::switching lane to $next after operational failure on previous provider"
            if run_review "$next"; then echo "lane=fallback:$next" >> "$GITHUB_STEP_SUMMARY"; exit 0; else rc=$?; fi
          done
          exit $rc

  # Recover missing verdicts up to the current head's retry limits.
  reconcile:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: write
    steps:
      - name: Re-dispatch when the latest head lacks a terminal result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_HEAD: ${{ needs.review.outputs.head }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUM" ]; then
            echo "no PR number in context; nothing to reconcile" >&2
            exit 0
          fi
          if [[ ! "$PR_NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR number must be a positive integer, received '$PR_NUM'"
            exit 1
          fi
          pr=$(gh api "repos/$REPO/pulls/$PR_NUM")
          state=$(jq -r .state <<< "$pr")
          if [ "$state" != "open" ]; then
            echo "PR #$PR_NUM is $state; nothing to reconcile"
            exit 0
          fi
          head_repo=$(jq -r .head.repo.full_name <<< "$pr")
          if [ "$head_repo" != "$REPO" ]; then
            echo "PR #$PR_NUM comes from $head_repo; fork reviews are skipped"
            exit 0
          fi
          head=$(jq -r .head.sha <<< "$pr")
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not read the current PR head"
            exit 1
          fi
          report_failure() {
            local kind="$1" title="$2" summary="$3"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="Needlefish" \
              -f head_sha="$head" \
              -f status="completed" \
              -f conclusion="failure" \
              -f external_id="$(jq -cn --argjson pr "$PR_NUM" \
                --arg run "$RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg round "$kind-$RUN_ID-$GITHUB_RUN_ATTEMPT" \
                '{v: 2, prNumber: $pr, roundId: $round, runId: $run, runAttempt: $attempt}')" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary" >/dev/null
          }
          report_retry_required() {
            report_failure retry-required 'Needlefish: caller retry required' "$1"
          }
          read_checks() {
            # GitHub defaults to latest per name. Count retry budget over all pages.
            gh api --paginate --slurp "repos/$REPO/commits/$1/check-runs?check_name=Needlefish&per_page=100&filter=all" |
              jq --argjson pr "$PR_NUM" '[.[].check_runs[]
                | select(.name == "Needlefish" and .app.slug == "github-actions" and (.id | type) == "number" and .id > 0)
                | ((.external_id // "" | fromjson?) // null) as $round
                | if ($round | type) == "object" then
                    select($round.v == 2 and $round.prNumber == $pr
                      and ($round.roundId | type) == "string" and ($round.roundId | length) > 0
                      and ($round.runId | type) == "string"
                      and ($round.recheck == null or ($round.recheck | type) == "boolean"))
                    | . + {run_id: $round.runId, run_attempt: $round.runAttempt,
                        precheck: ($round.recheck == null and ($round.roundId | startswith("precheck-")))}
                  else select((.external_id // "") | test("^[1-9][0-9]*$"))
                    | . + {run_id: .external_id, precheck: false}
                  end] | sort_by(.id)'
          }
          complete_checks() {
            local ids="$1" conclusion="$2" title="$3" summary="$4" id
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              gh api -X PATCH "repos/$REPO/check-runs/$id" \
                -f status=completed -f conclusion="$conclusion" \
                -f "output[title]=$title" -f "output[summary]=$summary" >/dev/null
            done <<< "$ids"
          }
          # Actions' workflow_dispatch head_sha names the workflow ref, not the PR target.
          target="${REVIEW_HEAD:-}"
          if [ -z "$target" ] && [ "${EVENT_PR:-}" = "$PR_NUM" ]; then target="${EVENT_HEAD:-}"; fi
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then target=""; fi
          if [ -n "$target" ] && [ "$target" != "$head" ]; then
            stale_checks=$(read_checks "$target")
            stale_ids=$(jq -r --arg run "$RUN_ID" '.[] | select(.run_id == $run and
              ((.conclusion == "neutral" and .output.title == "Needlefish: superseded") or .status == "in_progress")) | .id' <<< "$stale_checks")
            complete_checks "$stale_ids" cancelled 'Needlefish: superseded' 'A newer PR head replaced this review.'
          fi
          owned_checks=$(read_checks "$head")
          invalid_neutrals=$(jq -r '.[] | select(.conclusion == "neutral" and .output.title != "Needlefish: skipped (author not trusted)") | .id' <<< "$owned_checks")
          complete_checks "$invalid_neutrals" cancelled 'Needlefish: superseded' 'This legacy check did not deliver a review verdict.'
          if jq -e 'last | .status == "completed" and (
              (.conclusion == "success" and .output.title == "Needlefish: pass") or
              (.conclusion == "neutral" and .output.title == "Needlefish: skipped (author not trusted)") or
              (.conclusion == "failure" and ((.output.title // "") | test("^Needlefish: (changes_requested|needs_human)\\b|^Needlefish: caller retry required$"))))' <<< "$owned_checks" >/dev/null; then
            echo "head $head already has a terminal Needlefish verdict; nothing to reconcile"
            exit 0
          fi
          infra_fails=$(jq '[.[] | select(.conclusion == "failure" and ((.output.title // "") | test("^Needlefish: review (failed|terminated)$")))] | length' <<< "$owned_checks")
          precheck_fails=$(jq '
            def key: [.run_id, (.run_attempt // "1")];
            [.[] | select(.precheck and .conclusion == "failure") | key]
            - [.[] | select(.precheck | not) | key] | unique | length' <<< "$owned_checks")
          result="${REVIEW_RESULT:-skipped}"
          attempt_start=""
          if [ "$result" != skipped ] && [ "$GITHUB_RUN_ATTEMPT" != 1 ] &&
             jq -e --arg run "$RUN_ID" 'any(.[]; .run_id == $run and .run_attempt == null)' <<< "$owned_checks" >/dev/null; then
            # Old binaries omit runAttempt. On a rerun, use its start time to
            # distinguish checks created by this attempt from older checks.
            attempt_start=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '.run_started_at // empty')
          fi
          this_attempt=$(jq --arg run "$RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg start "$attempt_start" '
            [.[] | select(.run_id == $run and ((.run_attempt // "1") == $attempt or
              (.run_attempt == null and $start != "" and (.started_at // "") >= $start)))]' <<< "$owned_checks")
          if [ -z "$target" ] && jq -e 'length > 0' <<< "$this_attempt" >/dev/null; then target="$head"; fi
          precheck_missing=false
          if [ "$target" = "$head" ] && [ "$result" != skipped ]; then
            orphan_ids=$(jq -r '.[] | select(.status == "in_progress") | .id' <<< "$this_attempt")
            complete_checks "$orphan_ids" failure 'Needlefish: review terminated' 'The workflow ended before the review check completed. Use @needlefish recheck to retry.'
            if [ -n "$orphan_ids" ]; then infra_fails=$((infra_fails + $(wc -l <<< "$orphan_ids"))); fi
            if jq -e 'length == 0' <<< "$this_attempt" >/dev/null; then precheck_missing=true; fi
          fi
          workflow_file="${WORKFLOW_REF#"$REPO/.github/workflows/"}"
          workflow_file="${workflow_file%@*}"
          if [ -z "$workflow_file" ] || [ "$workflow_file" = "$WORKFLOW_REF" ] || [[ "$workflow_file" == */* ]]; then
            echo "::error::invalid caller workflow ref: $WORKFLOW_REF"
            exit 1
          fi
          workflow_probe=""
          if ! workflow_probe=$(gh api "repos/$REPO/actions/workflows/$workflow_file" 2>&1); then
            if [[ "$workflow_probe" == *"HTTP 404"* ]]; then
              report_retry_required "Caller workflow $workflow_file is unavailable. Add workflow_dispatch with a required pr_number input, then retry this PR review."
              exit 0
            fi
            echo "::error::review workflow probe failed: $workflow_probe"
            exit 1
          fi
          # Active runs are matched by THIS workflow file and the PR number in
          # run-name, never by head_sha or a literal workflow name: a
          # workflow_dispatch run reports the default branch's SHA, and caller
          # repos name the workflow whatever they like. This run is excluded.
          active_status=""
          for status in queued pending waiting requested in_progress; do
            active=$(gh api --paginate --slurp "repos/$REPO/actions/workflows/$workflow_file/runs?status=$status&per_page=100" |
              jq --arg run "$RUN_ID" --arg suffix " PR #$PR_NUM" '[.[].workflow_runs[] | select((.id | tostring) != $run and ((.display_title // "") | endswith($suffix)))] | length')
            if [ "$active" -gt 0 ]; then
              active_status="$status"
              break
            fi
          done
          if [ "$precheck_missing" = true ] && { [ "$result" != cancelled ] || [ -z "$active_status" ]; }; then
            report_failure precheck 'Needlefish: review did not start' "The review job ended ($result) before creating its review check. Use @needlefish recheck to retry."
            precheck_fails=$((precheck_fails + 1))
          fi
          if [ -n "$active_status" ]; then
            echo "a $workflow_file run for PR #$PR_NUM is $active_status; letting it finish"
            exit 0
          fi
          if [ -z "$target" ] && [ "$result" != skipped ]; then
            report_retry_required 'The workflow did not record its target commit. Use @needlefish recheck to retry.'
            exit 0
          fi
          if [ "$infra_fails" -ge 2 ]; then
            echo "::error::head $head has $infra_fails infra-failed reviews; retry cap reached. Use @needlefish recheck to retry."
            exit 0
          fi
          if [ "$precheck_fails" -ge 3 ]; then
            echo "::error::head $head has $precheck_fails failures before a review check; retry cap reached. Use @needlefish recheck to retry."
            exit 0
          fi
          dispatch_error=""
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          if [ -z "$default_branch" ]; then
            echo "::error::repository default branch is unavailable"
            exit 1
          fi
          if ! dispatch_error=$(gh workflow run "$workflow_file" --repo "$REPO" --ref "$default_branch" -f pr_number="$PR_NUM" 2>&1); then
            report_retry_required "Could not dispatch $workflow_file with pr_number. The caller must grant actions: write and declare workflow_dispatch.inputs.pr_number. GitHub reported: $dispatch_error"
            exit 0
          fi
          echo "reconciliation dispatched for PR #$PR_NUM head ${head:0:10} (infra failures so far: $infra_fails)"
