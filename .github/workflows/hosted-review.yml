# Manual self-managed review entry. No upstream action deployment.
name: hosted-review
run-name: "hosted-review PR #${{ inputs.pr_number || inputs.pr }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: false
      pr_number:
        description: PR number supplied by reconciliation
        required: false
permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write
jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      pr_number: ${{ inputs.pr_number || inputs.pr }}
      runner: codex
      # Self-hosted lane via CLIProxyAPI (frank_infra x64-review pool); eval #172.
      model: deepseek-v4.1-flash
      codex_reasoning_effort: high
      codex_proxy_base_url: ${{ vars.CODEX_PROXY_BASE_URL }}
      codex_proxy_required: true
      runs_on: x64-review
    secrets: inherit
